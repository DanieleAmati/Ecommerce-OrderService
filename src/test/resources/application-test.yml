spring:
  data:
    mongodb:
      host: ${MONGO_HOST:localhost}
      port: ${MONGO_PORT:27017}
      database: orderstest
      username: ${MONGO_USER:admin}
      password: ${MONGO_PASSWORD:password}
      authentication-database: admin
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration
